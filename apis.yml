name: MindMeld *
description: >-
  MindMeld is an open-source conversational-AI platform for building deep-domain
  voice interfaces and chatbots, originally developed by the GV-backed startup
  MindMeld (formerly Expect Labs), acquired by Cisco in 2017 and open-sourced in
  2019. Distributed as the `mindmeld` Python framework (Apache-2.0), it provides
  tooling for every step of a modern conversational workflow — domain and intent
  classification, entity recognition and resolution, and dialogue management —
  along with reusable application Blueprints for use cases such as food ordering,
  video discovery, and home-assistant experiences. MindMeld powers the Webex
  Assistant and other Cisco conversational products.
